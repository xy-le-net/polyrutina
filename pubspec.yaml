name: polyrutina
description: Бортовой журнал — след работы, привязанный к месту.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # значки.
  cupertino_icons: ^1.0.8

  # хранилище и пути.
  drift: ^2.35.1
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  path_provider: ^2.1.6

  # медиа: снимок, видео, файлы, звук, геопозиция.
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  record: ^6.0.0
  geolocator: ^13.0.1

  # системный лист «поделиться».
  share_plus: ^10.0.0

  # воспроизведение медиа: видео и аудио.
  video_player: ^2.9.2
  just_audio: ^0.9.42

  # отверзание вовне: геоточки, файлы, ссылки.
  url_launcher: ^6.3.1
  open_filex: ^4.5.0

  # карта для избрания геоточки (тайлы OpenStreetMap).
  # своя, а не системная: даёт снимок точки и не требует ключей.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # zip-архивы: выгрузка и приём рутин.
  archive: ^3.6.1

  # опознаватель устройства.
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # генерация кода Drift.
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n.json
    - assets/defaults.json