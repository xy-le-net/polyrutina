name: polyrutina
description: Location-bound field journal and routines.
publish_to: 'none'
version: 0.1.2+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons.
  cupertino_icons: ^1.0.8

  # State management.
  flutter_riverpod: ^2.6.1

  # Storage and paths.
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  path_provider: ^2.1.6

  # Media: photo, video, files, audio, geolocation.
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  record: ^6.0.0
  geolocator: ^13.0.1
  http: ^1.6.0

  # System share sheet.
  share_plus: ^10.0.0

  # Media playback: video and audio.
  video_player: ^2.9.2
  just_audio: ^0.9.42

  # External opening: geo points, files, links.
  url_launcher: ^6.3.1
  open_filex: ^4.5.0

  # Map for geo point selection (OpenStreetMap tiles).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Zip archives: export and import of routines.
  archive: ^3.6.1

  # Device identifier.
  device_info_plus: ^11.0.0

  # Ongoing notifications.
  flutter_local_notifications: ^18.0.1

  # Timezone support for deferred notices.
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Runtime permissions.
  permission_handler: ^11.3.1

  material_ui: any
  win_toast: ^0.4.0
  camera: 0.11.2
  camera_windows: 0.2.6
  
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.16.7

  flutter_lints: ^4.0.0

  # Linters for Riverpod
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.4

  # Drift code generation.
  build_runner: ^2.4.13
  drift_dev: ^2.24.0

  # App icon generator.
  flutter_launcher_icons: ^0.14.1

  # Native splash screen generator.
  flutter_native_splash: ^2.4.4

# Разрешение конфликта версий анализатора
dependency_overrides:
  analyzer: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n.json
    - assets/defaults.json
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#D9D3C7"
  image: assets/icon.png
  android_12:
    image: assets/icon.png
    color: "#D9D3C7"
    icon_background_color: "#D9D3C7"
  android: true
  ios: false
  fullscreen: false
