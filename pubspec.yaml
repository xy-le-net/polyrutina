name: polyrutina
description: Бортовой журнал — след работы, привязанный к месту.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Значки.
  cupertino_icons: ^1.0.8

  # База и пути.
  drift: ^2.35.1
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  path_provider: ^2.1.6

  # Медиа: снимок, видео, файлы, звук, геопозиция.
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  record: ^6.0.0
  geolocator: ^13.0.1

  # Системный лист «поделиться».
  share_plus: ^10.0.0

  # Zip-архивы: выгрузка и приём рутин.
  archive: ^3.6.1

  # Идентификатор устройства.
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Генерация кода Drift.
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n.json
    - assets/defaults.json