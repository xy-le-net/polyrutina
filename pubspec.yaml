name: polyrutina
description: Бортовой журнал — след работы, привязанный к месту.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Значки.
  cupertino_icons: ^1.0.8

  # База и пути.
  drift: ^2.35.1
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  path_provider: ^2.1.6

  # Таблица журнала.
  table_view_ex: ^0.1.6
  two_dimensional_scrollables: ^0.3.9

  # pdf и share_plus не вписаны нарочно — добавим командою,
  # дабы версии подобрались сами под окружение.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Генерация кода Drift.
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n.json
    - assets/defaults.json